name: Deploy MkDocs site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure mirror site URL
        run: |
          if [ "$GITHUB_REPOSITORY" = "rstaffinity/geoinst" ]; then
            echo "Configuring mkdocs for mirror repository rstaffinity/geoinst..."
            sed -i 's|site_url: https://geoinst.github.io/|site_url: https://rstaffinity.github.io/geoinst/|g' mkdocs.yml
          fi
      - run: pip install mkdocs-material pymdown-extensions
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
