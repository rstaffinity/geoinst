site_name: RST Instruments Knowledge Base
site_description: >-
  Geotechnical instrumentation intranet — RST Instruments portfolio,
  field monitoring guides, and reference manuals for engineers.
site_url: https://geoinst.github.io/
repo_url: https://github.com/geoinst/geoinst.github.io
repo_name: geoinst/geoinst.github.io
edit_uri: ""

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: Roboto Mono
  icon:
    logo: material/screw-machine-flat-top

extra:
  social:
    - icon: fontawesome/solid/globe
      link: https://www.orica.com/digital-solutions/geosolutions/rst-instruments/
      name: RST Instruments (Orica)
  generator: false

copyright: >
  © 2026 RST Instruments Knowledge Base · Built for geotechnical engineers

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search
  - tags

nav:
  - Home: index.md
  - Getting Started:
      - Overview: getting-started/index.md
      - Instrument Categories: getting-started/categories.md
      - How to Use This Site: getting-started/how-to-use.md
  - RST Instruments:
      - Company Profile: rst-instruments/index.md
      - RSTAR Affinity Platform: rst-instruments/rstar-affinity.md
      - Piezometers: rst-instruments/piezometers.md
      - Extensometers: rst-instruments/extensometers.md
      - Inclinometers: rst-instruments/inclinometers.md
      - Data Loggers: rst-instruments/data-loggers.md
  - Reference Manuals:
      - Index: reference-manuals/index.md
      - Dunnicliff — Field Performance: reference-manuals/dunnicliff.md
      - FHWA Geotech Instrumentation: reference-manuals/fhwa.md
      - Principles of Foundation Engineering: reference-manuals/das-foundation.md
      - Principles of Geotechnical Engineering: reference-manuals/das-geotech.md
  - Applications:
      - Index: applications/index.md
      - Slope Stability: applications/slope-stability.md
      - Dam Monitoring: applications/dam-monitoring.md
      - Tunnel Instrumentation: applications/tunnels.md
      - Foundation & Excavation: applications/foundations.md
  - Manufacturers:
      - Index: manufacturers/index.md
      - RST Instruments (Orica): manufacturers/rst.md
      - Durham Geo Slope Indicator: manufacturers/dgsi.md
      - GEO-Instruments: manufacturers/geo-instruments.md
      - Geocomp: manufacturers/geocomp.md
  - GTI Doctor (AI): gti-doctor.md
